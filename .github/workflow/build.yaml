name: Build Android APK

on:
  push:
    branches:
      - main # Ejecuta la acción al subir a la rama main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Configurar Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar dependencias de Capacitor
        run: npm install

      - name: Inicializar Android en Capacitor
        run: |
          npx cap add android
          npx cap sync android

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      - name: Compilar el APK con Gradle
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Subir APK generado
        uses: actions/upload-artifact@v3
        with:
          name: Asistencia-App-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk