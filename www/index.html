<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control de Asistencia</title>

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-pastel: #fdfbf7;
            --primary-pastel: #a3c4f3;
            --secondary-pastel: #f1c0e8;
            --tertiary-pastel: #b9fbc0;
            --text-color: #4a4e69;
            --card-bg: #ffffff;
            --ok-bg: #d4edda;
            --ok-border: #c3e6cb;
            --ok-text: #155724;
            --error-bg: #f8d7da;
            --error-border: #f5c6cb;
            --error-text: #721c24;
            --warning-bg: #fff3cd;
            --warning-border: #ffeeba;
            --warning-text: #856404;
        }

        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-pastel);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        header {
            background-color: var(--card-bg);
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-bottom: 4px solid var(--primary-pastel);
        }

        header h2 { margin: 0; font-size: 1.4rem; }

        .contenedor-principal {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        .panel-config {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.06);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        @media (min-width: 768px) {
            .panel-config {
                flex-direction: row;
                justify-content: center;
            }
        }

        .contenedor-paneles-inferiores {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .contenedor-paneles-inferiores {
                flex-direction: row;
                align-items: flex-start;
            }
        }

        .panel {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.06);
            flex: 1;
        }

        .panel-titulo {
            margin-top: 0;
            text-align: center;
            font-size: 1.1rem;
            color: var(--text-color);
            margin-bottom: 15px;
        }

        .btn-cargar, .btn-descargar {
            display: inline-block;
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
            width: 100%;
            max-width: 280px;
        }

        .btn-cargar {
            background-color: var(--primary-pastel);
            border: 2px solid #8eb4e6;
        }

        .btn-descargar {
            background-color: var(--tertiary-pastel);
            border: 2px solid #96e09e;
        }

        .btn-cargar:active, .btn-descargar:active {
            transform: scale(0.95);
        }

        #reader { width: 100%; border-radius: 8px; overflow: hidden; }

        #resultado-box {
            padding: 15px;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 600;
            text-align: center;
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .info-alumno {
            display: none;
            margin-top: 15px;
            padding: 20px;
            background-color: #f4f6f9;
            border-radius: 10px;
            border-left: 5px solid var(--secondary-pastel);
            animation: fadeIn 0.4s ease;
        }

        .info-alumno p { margin: 8px 0; font-size: 0.95rem; }
        .info-alumno strong { color: var(--text-color); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ok { background-color: var(--ok-bg); color: var(--ok-text); border: 1px solid var(--ok-border); }
        .vencido { background-color: var(--error-bg); color: var(--error-text); border: 1px solid var(--error-border); }
        .error { background-color: var(--warning-bg); color: var(--warning-text); border: 1px solid var(--warning-border); }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 0.85rem;
            color: #6c757d;
            background-color: var(--card-bg);
            border-top: 1px solid #e9ecef;
            margin-top: auto;
        }

        #cam-error {
            display: none;
            padding: 12px;
            border-radius: 8px;
            background-color: var(--warning-bg);
            color: var(--warning-text);
            border: 1px solid var(--warning-border);
            font-size: 0.9rem;
            margin-bottom: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h2>🎫 Control de Asistencia Institucional</h2>
    </header>

    <div class="contenedor-principal">

        <div class="panel-config">
            <div>
                <label for="csv-upload" class="btn-cargar">📥 Cargar Base de Datos</label>
                <input type="file" id="csv-upload" accept=".csv, text/csv, text/plain, */*" style="display: none;">
            </div>
            <div>
                <button id="btn-descargar" class="btn-descargar">📤 Exportar Entradas y Salidas</button>
            </div>
            <p id="db-status" style="font-size: 0.95rem; font-weight: 600; width: 100%; margin: 0;"></p>
        </div>

        <div class="contenedor-paneles-inferiores">
            <div class="panel">
                <h3 class="panel-titulo">Escanear Credencial</h3>
                <div id="cam-error"></div>
                <div id="reader"></div>
            </div>

            <div class="panel">
                <h3 class="panel-titulo">Información de la Persona</h3>
                <div id="resultado-box"></div>

                <div id="info-alumno" class="info-alumno">
                    <p><strong>👤 Nombre:</strong> <span id="dato-nombre"></span></p>
                    <p><strong>🎓 Grado/Grupo:</strong> <span id="dato-grado"></span></p>
                    <p><strong>💼 Cargo:</strong> <span id="dato-cargo"></span></p>
                    <p><strong>📅 Vigencia:</strong> <span id="dato-vigencia"></span></p>
                    <hr style="border: 0; border-top: 1px solid #dee2e6; margin: 15px 0;">
                    <p><strong>🕒 Ingreso (BD):</strong> <span id="dato-ingreso"></span></p>
                    <p><strong>🚪 Salida (BD):</strong> <span id="dato-salida"></span></p>
                </div>
            </div>
        </div>
    </div>

    <footer>
        copyright Rodrigo A. Muñoz Fuentealba
    </footer>

    <script>
        let baseDeDatos = [];
        let registrosDiarios = {}; 
        let fechaMemoria = new Date().toDateString(); 
        let escaneoPausado = false;

        const resultadoBox = document.getElementById('resultado-box');
        const infoAlumnoBox = document.getElementById('info-alumno');

        window.onload = () => {
            try {
                const datosGuardados = localStorage.getItem('institucionDB');
                if (datosGuardados) {
                    baseDeDatos = JSON.parse(datosGuardados);
                    actualizarEstadoDB(true);
                } else {
                    actualizarEstadoDB(false);
                }
            } catch (e) {
                baseDeDatos = [];
                actualizarEstadoDB(false);
            }

            try {
                const registrosGuardados = localStorage.getItem('asistenciasHoy');
                const fechaGuardada = localStorage.getItem('fechaAsistencias');
                const hoyString = new Date().toDateString();
                
                if (registrosGuardados && fechaGuardada === hoyString) {
                    registrosDiarios = JSON.parse(registrosGuardados);
                    fechaMemoria = fechaGuardada;
                } else {
                    registrosDiarios = {};
                    fechaMemoria = hoyString;
                    localStorage.setItem('asistenciasHoy', JSON.stringify(registrosDiarios));
                    localStorage.setItem('fechaAsistencias', fechaMemoria);
                }
            } catch (e) {
                registrosDiarios = {};
            }

            iniciarLector();
        };

        function actualizarEstadoDB(cargada) {
            const status = document.getElementById('db-status');
            if (cargada) {
                status.innerHTML = `✅ Base de datos activa con <strong>${baseDeDatos.length}</strong> registros.`;
                status.style.color = "var(--ok-text)";
            } else {
                status.innerHTML = `⚠️ Sistema vacío. Carga un archivo CSV para comenzar.`;
                status.style.color = "var(--error-text)";
            }
        }

        document.getElementById('csv-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) { procesarCSV(event.target.result); };
            reader.onerror = function() { alert('Error al leer el archivo.'); };
            reader.readAsText(file, 'UTF-8');
            e.target.value = '';
        });

        function parsearLineaCSV(linea) {
            const resultado = [];
            let campoActual = '';
            let dentroComillas = false;
            for (let i = 0; i < linea.length; i++) {
                const c = linea[i];
                if (c === '"') {
                    if (dentroComillas && linea[i + 1] === '"') { campoActual += '"'; i++; } 
                    else { dentroComillas = !dentroComillas; }
                } else if (c === ',' && !dentroComillas) {
                    resultado.push(campoActual);
                    campoActual = '';
                } else {
                    campoActual += c;
                }
            }
            resultado.push(campoActual);
            return resultado.map(v => v.trim());
        }

        // --- SECCIÓN MODIFICADA PARA 10 COLUMNAS ---
        function procesarCSV(texto) {
            const textoLimpio = texto.replace(/^\uFEFF/, '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
            const lineas = textoLimpio.split('\n');
            const dataTemporal = [];

            for (let i = 1; i < lineas.length; i++) {
                if (lineas[i].trim() === '') continue;
                const columnas = parsearLineaCSV(lineas[i]);
                
                // Aseguramos que lea tu estructura exacta de 10 columnas
                if (columnas.length >= 9 && columnas[1] !== '') {
                    dataTemporal.push({
                        id: columnas[1],                             // Columna B (ID)
                        nombre: columnas[2],                         // Columna C (NOMBRE)
                        gradoGrupo: columnas[3] + " " + columnas[4], // Columna D (GRADO) y E (GRUPO)
                        vencimiento: columnas[6],                    // Columna G (VENCIMIENTO)
                        ingreso: columnas[7],                        // Columna H (INGRESO)
                        salida: columnas[8],                         // Columna I (SALIDA)
                        cargo: columnas[9] || "Alumno"               // Columna J (CARGO)
                    });
                }
            }

            if (dataTemporal.length > 0) {
                baseDeDatos = dataTemporal;
                localStorage.setItem('institucionDB', JSON.stringify(baseDeDatos));
                actualizarEstadoDB(true);
                alert(`¡Éxito! Se cargaron ${baseDeDatos.length} registros con formato de 10 columnas.`);
            } else {
                alert('Error: El archivo CSV no coincide con la plantilla. Asegúrate de tener las 10 columnas en orden.');
            }
        }

        function parsearFecha(texto) {
            if (!texto) return null;
            const limpio = texto.trim();
            let m = limpio.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
            if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
            m = limpio.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
            if (m) return new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]));
            const intento = new Date(limpio);
            return isNaN(intento.getTime()) ? null : intento;
        }

        function mostrarMensaje(estado, texto, usuario = null) {
            resultadoBox.className = estado;
            resultadoBox.innerHTML = texto;
            resultadoBox.style.display = 'block';

            if (usuario) {
                document.getElementById('dato-nombre').textContent = usuario.nombre;
                document.getElementById('dato-grado').textContent = usuario.gradoGrupo; // Nuevo dato inyectado
                document.getElementById('dato-cargo').textContent = usuario.cargo;
                document.getElementById('dato-vigencia').textContent = usuario.vencimiento;
                document.getElementById('dato-ingreso').textContent = usuario.ingreso;
                document.getElementById('dato-salida').textContent = usuario.salida;
                infoAlumnoBox.style.display = 'block';
            } else {
                infoAlumnoBox.style.display = 'none';
            }
        }

        function validarAcceso(codigoLeido) {
            const hoyString = new Date().toDateString();
            if (hoyString !== fechaMemoria) {
                registrosDiarios = {};
                fechaMemoria = hoyString;
                localStorage.setItem('asistenciasHoy', JSON.stringify(registrosDiarios));
                localStorage.setItem('fechaAsistencias', fechaMemoria);
            }

            const codigo = (codigoLeido || '').trim().toLowerCase();
            if (baseDeDatos.length === 0) {
                mostrarMensaje('error', '❌ Error: Base de datos no cargada.');
                return;
            }

            const usuario = baseDeDatos.find(persona => persona.id.toLowerCase() === codigo);
            if (!usuario) {
                mostrarMensaje('vencido', '❌ ACCESO DENEGADO<br><small>Credencial no registrada en el sistema.</small>');
                return;
            }

            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0);
            const fechaVencimiento = parsearFecha(usuario.vencimiento);

            if (!fechaVencimiento) {
                mostrarMensaje('error', `⚠️ Error en la base de datos.<br><small>Formato de fecha inválido.</small>`, usuario);
                return;
            }
            
            fechaVencimiento.setHours(0, 0, 0, 0);
            if (hoy > fechaVencimiento) {
                mostrarMensaje('vencido', `🚨 ACCESO DENEGADO<br><small>Credencial vencida el ${usuario.vencimiento}</small>`, usuario);
                return;
            }

            let estadoActual = registrosDiarios[codigo];
            
            if (typeof estadoActual === 'string') {
                estadoActual = { estado: estadoActual, horaIngreso: 'Previa', horaSalida: '---' };
            }

            const horaActual = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            if (!estadoActual) {
                registrosDiarios[codigo] = { estado: 'ingreso', horaIngreso: horaActual, horaSalida: '---' };
                localStorage.setItem('asistenciasHoy', JSON.stringify(registrosDiarios)); 
                mostrarMensaje('ok', `✅ INGRESO REGISTRADO<br><strong>Hora de llegada: ${horaActual}</strong>`, usuario);
            } 
            else if (estadoActual.estado === 'ingreso') {
                registrosDiarios[codigo].estado = 'salida';
                registrosDiarios[codigo].horaSalida = horaActual;
                localStorage.setItem('asistenciasHoy', JSON.stringify(registrosDiarios)); 
                mostrarMensaje('ok', `👋 SALIDA REGISTRADA<br><strong>Hora de salida: ${horaActual}</strong>`, usuario);
            } 
            else {
                mostrarMensaje('error', `⚠️ REGISTRO DUPLICADO<br><small>Esta credencial ya registró su salida hoy.</small>`, usuario);
            }
        }

        document.getElementById('btn-descargar').addEventListener('click', () => {
            if (Object.keys(registrosDiarios).length === 0) {
                alert('No hay registros de asistencia el día de hoy para exportar.');
                return;
            }

            // --- EXPORTACIÓN ACTUALIZADA CON GRADO Y GRUPO ---
            let csvContent = "ID,Nombre,Grado/Grupo,Cargo,Hora Ingreso,Hora Salida\n";

            for (const codigo in registrosDiarios) {
                const registro = registrosDiarios[codigo];
                const usuario = baseDeDatos.find(u => u.id.toLowerCase() === codigo);
                
                if (usuario) {
                    csvContent += `"${usuario.id}","${usuario.nombre}","${usuario.gradoGrupo}","${usuario.cargo}","${registro.horaIngreso}","${registro.horaSalida}"\n`;
                }
            }

            const nombreArchivo = `Reporte_Asistencia_${new Date().toISOString().split('T')[0]}.csv`;
            const blob = new Blob(["\ufeff" + csvContent], { type: 'text/csv;charset=utf-8;' });

            const file = new File([blob], nombreArchivo, { type: 'text/csv' });
            
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                navigator.share({
                    title: 'Reporte de Asistencia',
                    text: 'Se adjunta el reporte de entradas y salidas del día.',
                    files: [file]
                }).catch(error => console.log('Operación de compartir cancelada', error));
            } else {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = nombreArchivo;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }
        });

        function onScanSuccess(decodedText) {
            if (escaneoPausado) return;
            escaneoPausado = true;
            validarAcceso(decodedText);
            setTimeout(() => {
                resultadoBox.style.display = 'none';
                infoAlumnoBox.style.display = 'none';
                escaneoPausado = false;
            }, 3000);
        }

        function onScanFailure() {}

        function iniciarLector() {
            const camError = document.getElementById('cam-error');
            if (typeof Html5QrcodeScanner === 'undefined') {
                camError.style.display = 'block';
                camError.textContent = '⚠️ No se pudo cargar la librería del lector QR. Revisa tu conexión a internet.';
                return;
            }
            try {
                const html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 250 } }, false);
                html5QrcodeScanner.render(onScanSuccess, onScanFailure);
            } catch (e) {
                camError.style.display = 'block';
                camError.textContent = '⚠️ No se pudo iniciar la cámara. Verifica permisos.';
            }
        }
    </script>
</body>
</html>
