<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control de Asistencia</title>
    
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-pastel: #fdfbf7;
            --primary-pastel: #a3c4f3;
            --secondary-pastel: #f1c0e8;
            --text-color: #4a4e69;
            --card-bg: #ffffff;
            --ok-bg: #d4edda;
            --ok-border: #c3e6cb;
            --ok-text: #155724;
            --error-bg: #f8d7da;
            --error-border: #f5c6cb;
            --error-text: #721c24;
            --warning-bg: #fff3cd;
            --warning-border: #ffeeba;
            --warning-text: #856404;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            margin: 0; 
            padding: 0;
            background-color: var(--bg-pastel); 
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            user-select: none; 
            -webkit-user-select: none;
        }
        
        header {
            background-color: var(--card-bg);
            padding: 15px 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            border-bottom: 4px solid var(--primary-pastel);
        }

        header h2 { margin: 0; font-size: 1.4rem; }

        .contenedor-principal {
            flex: 1; 
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        @media (min-width: 768px) {
            .contenedor-principal {
                flex-direction: row;
                align-items: flex-start;
            }
        }

        .panel {
            background-color: var(--card-bg);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.06);
            flex: 1;
        }

        .panel-titulo {
            margin-top: 0;
            text-align: center;
            font-size: 1.1rem;
            color: var(--text-color);
            margin-bottom: 15px;
        }

        #reader { width: 100%; border-radius: 8px; overflow: hidden; }
        
        #resultado-box { 
            padding: 15px; 
            border-radius: 8px; 
            font-size: 1.05rem; 
            font-weight: 600; 
            text-align: center;
            display: none; 
            animation: fadeIn 0.4s ease;
        }
        
        .info-alumno {
            display: none;
            margin-top: 15px;
            padding: 20px;
            background-color: #f4f6f9;
            border-radius: 10px;
            border-left: 5px solid var(--secondary-pastel);
            animation: fadeIn 0.4s ease;
        }

        .info-alumno p { margin: 8px 0; font-size: 0.95rem; }
        .info-alumno strong { color: var(--text-color); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ok { background-color: var(--ok-bg); color: var(--ok-text); border: 1px solid var(--ok-border); }
        .vencido { background-color: var(--error-bg); color: var(--error-text); border: 1px solid var(--error-border); }
        .error { background-color: var(--warning-bg); color: var(--warning-text); border: 1px solid var(--warning-border); }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 0.85rem;
            color: #6c757d;
            background-color: var(--card-bg);
            border-top: 1px solid #e9ecef;
            margin-top: auto; 
        }
    </style>
</head>
<body>

    <header>
        <h2>🎫 Control de Asistencia</h2>
    </header>
    
    <div class="contenedor-principal">
        <div class="panel">
            <h3 class="panel-titulo">Escanear Credencial</h3>
            <div id="reader"></div>
        </div>

        <div class="panel">
            <h3 class="panel-titulo">Información del Alumno</h3>
            <div id="resultado-box"></div>

            <div id="info-alumno" class="info-alumno">
                <p><strong>👨‍🎓 Nombre:</strong> <span id="dato-nombre"></span></p>
                <p><strong>📅 Vigencia:</strong> <span id="dato-vigencia"></span></p>
                <hr style="border: 0; border-top: 1px solid #dee2e6; margin: 15px 0;">
                <p><strong>🕒 Horario de Ingreso:</strong> <span id="dato-ingreso"></span></p>
                <p><strong>🚪 Horario de Salida:</strong> <span id="dato-salida"></span></p>
            </div>
        </div>
    </div>

    <footer>
        copyright Rodrigo A. Muñoz Fuentealba
    </footer>

    <script>
        let baseDeDatos = []; 

        // Cargar el archivo JSON al iniciar
        async function cargarDatos() {
            try {
                const respuesta = await fetch('alumnos.json'); 
                baseDeDatos = await respuesta.json(); 
            } catch (error) {
                mostrarMensaje('error', '❌ Error al cargar la base de datos.');
            }
        }

        window.onload = cargarDatos;

        const resultadoBox = document.getElementById('resultado-box');
        const infoAlumnoBox = document.getElementById('info-alumno');
        let escaneoPausado = false; 

        function mostrarMensaje(estado, texto, usuario = null) {
            resultadoBox.className = estado; 
            resultadoBox.innerHTML = texto;
            resultadoBox.style.display = 'block';

            if (usuario) {
                document.getElementById('dato-nombre').textContent = usuario.nombre;
                document.getElementById('dato-vigencia').textContent = usuario.vencimiento;
                document.getElementById('dato-ingreso').textContent = usuario.ingreso;
                document.getElementById('dato-salida').textContent = usuario.salida;
                infoAlumnoBox.style.display = 'block';
            } else {
                infoAlumnoBox.style.display = 'none';
            }
        }

        function validarAcceso(codigoLeido) {
            const usuario = baseDeDatos.find(alumno => alumno.id === codigoLeido);

            if (!usuario) {
                mostrarMensaje('error', '❌ Credencial no registrada.');
                return;
            }
            
            const hoy = new Date();
            hoy.setHours(0, 0, 0, 0); 
            const fechaVencimiento = new Date(usuario.vencimiento + "T00:00:00");

            if (hoy > fechaVencimiento) {
                mostrarMensaje('vencido', `🚨 ACCESO DENEGADO<br><small>Credencial vencida el ${usuario.vencimiento}</small>`, usuario);
            } else {
                mostrarMensaje('ok', `✅ ACCESO PERMITIDO<br><small>Asistencia registrada</small>`, usuario);
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (escaneoPausado) return; 
            escaneoPausado = true; 
            
            validarAcceso(decodedText);

            setTimeout(() => {
                resultadoBox.style.display = 'none';
                infoAlumnoBox.style.display = 'none';
                escaneoPausado = false;
            }, 4000); 
        }

        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: { width: 250, height: 250 } }, false
        );
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
